<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050a1a"/>
      <stop offset="1" stop-color="#03060f"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="0.6" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <radialGradient id="glow" cx="20%" cy="0%" r="80%">
      <stop offset="0" stop-color="#2563eb" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="100%" cy="100%" r="70%">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <!-- logo mark is composited in as a raster (public/logo-mark.png) -->
  <text x="200" y="128" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#ffffff">DigitalPitch</text>
  <text x="200" y="160" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" fill="#67e8f9" letter-spacing="4">TECHNOLOGIES</text>

  <!-- headline -->
  <text x="90" y="330" font-family="Arial, Helvetica, sans-serif" font-size="88" font-weight="800" fill="#ffffff" letter-spacing="-2">Build. Rank.</text>
  <text x="90" y="430" font-family="Arial, Helvetica, sans-serif" font-size="88" font-weight="800" fill="url(#brand)" letter-spacing="-2">Automate. Grow.</text>

  <!-- subtext -->
  <text x="92" y="500" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="#94a3b8">Websites · SEO · Google Visibility · AI Agents · Automation · Leads</text>

  <!-- url pill -->
  <g transform="translate(90,540)">
    <rect width="330" height="52" rx="26" fill="#0a1226" stroke="#1e2a4a"/>
    <text x="165" y="34" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="600" text-anchor="middle" fill="#e2e8f0">digitalpitchtech.com</text>
  </g>

  <!-- decorative network sphere -->
  <g transform="translate(920,315)" opacity="0.9">
    <circle r="150" fill="none" stroke="#22d3ee" stroke-opacity="0.25" stroke-width="1"/>
    <circle r="110" fill="none" stroke="#2563eb" stroke-opacity="0.3" stroke-width="1"/>
    <circle r="70" fill="none" stroke="#8b5cf6" stroke-opacity="0.35" stroke-width="1"/>
    <circle r="26" fill="url(#brand)"/>
    <g fill="#67e8f9">
      <circle cx="150" cy="0" r="5"/>
      <circle cx="-150" cy="0" r="5"/>
      <circle cx="0" cy="150" r="5"/>
      <circle cx="0" cy="-150" r="5"/>
      <circle cx="106" cy="106" r="5"/>
      <circle cx="-106" cy="-106" r="5"/>
      <circle cx="106" cy="-106" r="5"/>
      <circle cx="-106" cy="106" r="5"/>
    </g>
    <g stroke="#3b82f6" stroke-opacity="0.35" stroke-width="1">
      <line x1="0" y1="0" x2="150" y2="0"/>
      <line x1="0" y1="0" x2="-150" y2="0"/>
      <line x1="0" y1="0" x2="0" y2="150"/>
      <line x1="0" y1="0" x2="0" y2="-150"/>
      <line x1="0" y1="0" x2="106" y2="106"/>
      <line x1="0" y1="0" x2="-106" y2="-106"/>
      <line x1="0" y1="0" x2="106" y2="-106"/>
      <line x1="0" y1="0" x2="-106" y2="106"/>
    </g>
  </g>
</svg>
